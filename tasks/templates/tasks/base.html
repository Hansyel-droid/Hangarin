<!-- ============================================================
     RESPONSIVE PATCH FOR base.html
     
     INSTRUCTIONS: Make these 3 changes to your base.html:
     
     1. Add the CSS block below inside your <style> tag (before the closing </style>)
     2. Replace your <aside class="sidebar"> opening tag area with the new version
     3. Add the <script> block before </body>
     ============================================================ -->


<!-- ════════════════════════════════════════════════════════════
     CHANGE 1: Add this entire block inside your <style> tag,
     just before the closing </style> tag
════════════════════════════════════════════════════════════ -->
<style>
        /* ═══════════════════════════════════════
           MOBILE HAMBURGER BUTTON
        ═══════════════════════════════════════ */
        .hamburger {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 200;
            width: 40px;
            height: 40px;
            background: var(--sb-bg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
        }

        .hamburger span {
            display: block;
            width: 18px;
            height: 2px;
            background: rgba(255,255,255,0.8);
            border-radius: 2px;
            transition: all 0.25s ease;
            transform-origin: center;
        }

        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* ═══════════════════════════════════════
           SIDEBAR OVERLAY (mobile backdrop)
        ═══════════════════════════════════════ */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 99;
            backdrop-filter: blur(2px);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.visible {
            opacity: 1;
        }

        /* ═══════════════════════════════════════
           RESPONSIVE BREAKPOINTS
        ═══════════════════════════════════════ */
        @media (max-width: 768px) {

            /* Show hamburger */
            .hamburger { display: flex; }

            /* Show overlay element */
            .sidebar-overlay { display: block; }

            /* Sidebar slides off-screen by default */
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 150;
                width: 260px;
            }

            /* Sidebar slides in when open */
            .sidebar.open {
                transform: translateX(0);
            }

            /* Main content takes full width */
            .main {
                margin-left: 0;
                width: 100%;
            }

            /* Topbar adjustments */
            .topbar {
                padding: 0 16px 0 64px; /* left padding makes room for hamburger */
                height: 56px;
            }

            .topbar-left h1 {
                font-size: 15px;
            }

            /* Content padding tighter on mobile */
            .content {
                padding: 18px 16px 90px; /* bottom padding for bottom nav */
            }

            /* Stats grid 2 cols on mobile */
            .stats-grid,
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 18px;
            }

            .stat-num, .stat-value { font-size: 24px; }

            /* Cards */
            .card { padding: 16px; }

            /* Tables scroll horizontally */
            .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

            /* Grid layouts stack */
            .grid-2, .grid-3 { grid-template-columns: 1fr; }

            /* Filter bar stacks */
            .filter-bar { flex-direction: column; align-items: stretch; }
            .search-box { min-width: unset; }
            .filter-group { flex-wrap: wrap; }

            /* Topbar actions wrap */
            .topbar-right { gap: 6px; }
            .topbar-right .btn span { display: none; } /* hide button text on mobile, keep icon */

            /* Detail header stacks */
            .detail-header { flex-direction: column; gap: 12px; }
        }

        @media (max-width: 480px) {
            /* Single column stats on very small phones */
            .stats-grid,
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .topbar-left h1 { font-size: 14px; }
            .content { padding: 14px 12px 90px; }
            .card { padding: 14px; }
        }

        /* ═══════════════════════════════════════
           BOTTOM NAV BAR (mobile only)
        ═══════════════════════════════════════ */
        .bottom-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0; left: 0; right: 0;
                height: 62px;
                background: var(--sb-bg);
                border-top: 1px solid rgba(255,255,255,0.08);
                z-index: 90;
                align-items: stretch;
                padding-bottom: env(safe-area-inset-bottom); /* iPhone notch support */
            }

            .bottom-nav a {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                color: rgba(255,255,255,0.40);
                text-decoration: none;
                font-size: 10px;
                font-weight: 500;
                letter-spacing: 0.3px;
                transition: color 0.15s;
                padding: 6px 4px;
            }

            .bottom-nav a i {
                font-size: 18px;
                line-height: 1;
            }

            .bottom-nav a.active {
                color: #4a7c59;
            }

            .bottom-nav a:hover {
                color: rgba(255,255,255,0.75);
            }
        }
</style>


<!-- ════════════════════════════════════════════════════════════
     CHANGE 2: Replace the opening of your <body> section.
     Add the hamburger button and overlay BEFORE your <aside class="sidebar">
════════════════════════════════════════════════════════════ -->

    <span></span>

<!-- ════════════════════════════════════════════════════════════
     CHANGE 4: Add this <script> block just before </body>
════════════════════════════════════════════════════════════ -->
<script>
    const hamburger = document.getElementById('hamburgerBtn');
    const sidebar   = document.querySelector('.sidebar');
    const overlay   = document.getElementById('sidebarOverlay');

    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('visible');
        hamburger.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('visible');
        hamburger.classList.remove('open');
        document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', () => {
        sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });

    overlay.addEventListener('click', closeSidebar);

    // Close sidebar when a nav link is clicked (navigate away)
    sidebar.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', closeSidebar);
    });
</script>
